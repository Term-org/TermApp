name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon --stacktrace :app:assembleTermoneDebug

      - name: Build release APKs
        if: github.event_name != 'pull_request'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          for flavor in termone termtwo termthree termfour; do
            src="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            if [ ! -f "$src" ]; then
              echo "Missing $src" >&2
              exit 1
            fi
            cp "$src" "dist/$flavor.apk"
          done
          ls -l dist

      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30