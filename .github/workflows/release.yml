
name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'workflow_dispatch' ||
          github.event.workflow_run.event == 'push'
        ) &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate CI run
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA_EVENT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "$RUN_ID" ] || [ -z "$SHA_EVENT" ]; then
            echo "Missing CI run ID or commit SHA" >&2
            exit 1
          fi

          ci_workflow_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
              --jq .id
          )"

          run_data="$(
            gh run view "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json headSha,status,conclusion,workflowDatabaseId,event
          )"

          run_sha="$(jq -r '.headSha' <<< "$run_data")"
          run_status="$(jq -r '.status' <<< "$run_data")"
          run_conclusion="$(jq -r '.conclusion' <<< "$run_data")"
          run_workflow_id="$(jq -r '.workflowDatabaseId' <<< "$run_data")"
          run_event="$(jq -r '.event' <<< "$run_data")"

          if [ "$run_workflow_id" != "$ci_workflow_id" ]; then
            echo "The selected run does not belong to CI" >&2
            exit 1
          fi

          if [ "$run_status" != "completed" ] ||
             [ "$run_conclusion" != "success" ]; then
            echo "CI did not complete successfully" >&2
            exit 1
          fi

          if [ "$run_event" != "push" ] &&
             [ "$run_event" != "workflow_dispatch" ]; then
            echo "Unsupported CI event: $run_event" >&2
            exit 1
          fi

          if [ "$run_sha" != "$SHA_EVENT" ]; then
            echo "CI commit SHA mismatch" >&2
            exit 1
          fi

          {
            echo "run_id=$RUN_ID"
            echo "sha=$SHA_EVENT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0

      - name: Identify release tag
        id: version
        env:
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin --force --tags

          tags="$(
            git tag --points-at "$SHA" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )"

          if [ -z "$tags" ]; then
            echo "This CI commit has no release tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count="$(printf '%s\n' "$tags" | wc -l | tr -d ' ')"

          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one release tag for $SHA" >&2
            exit 1
          fi

          tag="$(printf '%s\n' "$tags" | head -n 1)"

          name="$(bash scripts/version.sh get-name)"
          code="$(bash scripts/version.sh get-code)"

          if [ "$tag" != "v$name" ]; then
            echo "Tag/version mismatch: $tag vs v$name" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "$tag^{commit}")"

          if [ "$tag_sha" != "$SHA" ]; then
            echo "Release tag does not point to the CI commit" >&2
            exit 1
          fi

          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

      - name: Download built APKs
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          set -euo pipefail

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name apks \
            --dir unsigned

          for flavor in termone termtwo termthree termfour; do
            test -f "unsigned/$flavor.apk" || {
              echo "Missing unsigned/$flavor.apk" >&2
              exit 1
            }
          done

          ls -lh unsigned

      - name: Set up Java
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Build Tools
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail

          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager" ]; then
            echo "Android SDK manager not found" >&2
            exit 1
          fi

          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "build-tools;35.0.0"

      - name: Sign the APKs
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}

          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$KS_PASS" ] ||
             [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEY_PASS" ]; then
            echo "Signing secrets are missing" >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"

          test -x "$apksigner"
          test -x "$aapt2"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/release.jks"

          mkdir -p signed

          declare -A labels=(
            [termone]=TermOne
            [termtwo]=TermTwo
            [termthree]=TermThree
            [termfour]=TermFour
          )

          declare -A ids=(
            [termone]=app.term.one
            [termtwo]=app.term.two
            [termthree]=app.term.three
            [termfour]=app.term.four
          )

          for flavor in termone termtwo termthree termfour; do
            src="unsigned/$flavor.apk"
            badging="$("$aapt2" dump badging "$src")"

            if ! grep -qF "package: name='${ids[$flavor]}'" <<< "$badging"; then
              echo "Invalid application ID in $src" >&2
              exit 1
            fi

            if ! grep -qF "versionName='$NAME'" <<< "$badging"; then
              echo "Invalid versionName in $src" >&2
              exit 1
            fi

            if ! grep -qF "versionCode='$CODE'" <<< "$badging"; then
              echo "Invalid versionCode in $src" >&2
              exit 1
            fi

            out="signed/${labels[$flavor]}-$TAG.apk"

            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$out" \
              "$src"

            "$apksigner" verify --print-certs "$out"
          done

          (
            cd signed
            sha256sum ./*.apk > SHA256SUMS
          )

          cat signed/SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish APKs to release branch
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail

          branch_dir="$RUNNER_TEMP/release-branch"

          if git ls-remote --exit-code --heads origin release \
            >/dev/null 2>&1; then

            git fetch origin \
              +refs/heads/release:refs/remotes/origin/release

            git worktree add -B release \
              "$branch_dir" \
              refs/remotes/origin/release
          else
            git worktree add --detach "$branch_dir" "$SHA"

            git -C "$branch_dir" switch --orphan release
            git -C "$branch_dir" clean -fdx
          fi

          dest="$branch_dir/releases/$TAG"

          if [ -d "$dest" ]; then
            if diff -qr signed "$dest"; then
              echo "Version $TAG already published identically."
              exit 0
            fi

            echo "Version $TAG already exists with different files." >&2
            exit 1
          fi

          mkdir -p "$dest"
          cp signed/*.apk signed/SHA256SUMS "$dest/"

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$branch_dir" add "releases/$TAG"
          git -C "$branch_dir" commit -m "Publish $TAG"
          git -C "$branch_dir" push origin HEAD:refs/heads/release

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "GitHub Release $TAG already exists."

            gh release upload "$TAG" \
              signed/*.apk \
              signed/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              signed/*.apk \
              signed/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
