name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0 (must match versionName in app/build.gradle.kts)"
        required: true
      run_id:
        description: "CI run to take the APKs from (empty = latest successful push run on main)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "The tag must look like v0.1.0" >&2
            exit 1
          fi

      - name: Select the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful CI run was found" >&2
            exit 1
          fi
          SHA="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using CI run $RUN_ID built from $SHA"

      - name: Download the built APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" --name apks --dir unsigned
          ls -l unsigned

      - name: Sign the APKs
        env:
          TAG: ${{ inputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "The signing secrets are not set" >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"
          version="${TAG#v}"

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p signed

          declare -A labels=([termone]=TermOne [termtwo]=TermTwo [termthree]=TermThree [termfour]=TermFour)
          declare -A ids=([termone]=app.term.one [termtwo]=app.term.two [termthree]=app.term.three [termfour]=app.term.four)

          for flavor in termone termtwo termthree termfour; do
            src="unsigned/$flavor.apk"
            if [ ! -f "$src" ]; then
              echo "Missing $src" >&2
              exit 1
            fi

            badging="$("$aapt2" dump badging "$src")"
            if ! grep -qF "package: name='${ids[$flavor]}'" <<<"$badging"; then
              echo "$src does not have the application id ${ids[$flavor]}" >&2
              exit 1
            fi
            if ! grep -qF "versionName='$version'" <<<"$badging"; then
              echo "$src does not have versionName $version; update app/build.gradle.kts and run CI again" >&2
              exit 1
            fi

            out="signed/${labels[$flavor]}-$TAG.apk"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$out" \
              "$src"
            "$apksigner" verify --print-certs "$out"
          done

          (cd signed && sha256sum ./*.apk > SHA256SUMS)
          cat signed/SHA256SUMS

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" signed/*.apk signed/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.run.outputs.sha }}" \
            --title "$TAG" \
            --generate-notes