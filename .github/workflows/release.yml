
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v0.2.0"
        required: true
        type: string

      run_id:
        description: "CI run ID (empty = latest successful CI run for the tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Select the run and the commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.id }}
          SHA_EVENT: ${{ github.event.workflow_run.head_sha }}
          TAG_INPUT: ${{ inputs.tag }}
          RUN_INPUT: ${{ inputs.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$RUN_EVENT"
            sha="$SHA_EVENT"
          else
            if ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The tag must look like v1.2.3" >&2
              exit 1
            fi

            sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$TAG_INPUT" \
              --jq .sha)"

            run_id="$RUN_INPUT"

            if [ -z "$run_id" ]; then
              run_id="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow ci.yml \
                  --commit "$sha" \
                  --limit 100 \
                  --json databaseId,headSha,status,conclusion \
                  --jq "[.[] |
                    select(
                      .headSha == \"$sha\" and
                      .status == \"completed\" and
                      .conclusion == \"success\"
                    )
                  ][0].databaseId // empty"
              )"
            fi
          fi

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful CI run was found" >&2
            exit 1
          fi

          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid CI run ID: $run_id" >&2
            exit 1
          fi

          if [ -z "$sha" ]; then
            echo "Commit SHA is empty" >&2
            exit 1
          fi

          ci_workflow_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
              --jq .id
          )"

          run_data="$(
            gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json headSha,status,conclusion,workflowDatabaseId
          )"

          run_sha="$(jq -r '.headSha' <<< "$run_data")"
          run_status="$(jq -r '.status' <<< "$run_data")"
          run_conclusion="$(jq -r '.conclusion' <<< "$run_data")"
          run_workflow_id="$(jq -r '.workflowDatabaseId' <<< "$run_data")"

          if [ "$run_workflow_id" != "$ci_workflow_id" ]; then
            echo "The selected run does not belong to CI" >&2
            exit 1
          fi

          if [ "$run_status" != "completed" ] ||
             [ "$run_conclusion" != "success" ]; then
            echo "The selected CI run did not succeed" >&2
            exit 1
          fi

          if [ "$run_sha" != "$sha" ]; then
            echo "CI run $run_id was built from $run_sha, not $sha" >&2
            exit 1
          fi

          {
            echo "run_id=$run_id"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.select.outputs.sha }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          name="$(bash scripts/version.sh get-name)"
          code="$(bash scripts/version.sh get-code)"
          tag="v$name"

          release=false

          if git tag --points-at "$SHA" | grep -Fxq "$tag"; then
            release=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "The tag $tag does not point at $SHA" >&2
            exit 1
          else
            echo "This commit is not tagged $tag."
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$TAG_INPUT" != "$tag" ]; then
            echo "Tag mismatch: expected $tag, got $TAG_INPUT" >&2
            exit 1
          fi

          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Download the built APKs
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name apks \
            --dir unsigned

          ls -lh unsigned

      - name: Set up Java
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Build Tools
        if: steps.version.outputs.release == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager" ]; then
            echo "Android SDK manager not found: $sdkmanager" >&2
            exit 1
          fi

          yes | "$sdkmanager" --licenses > /dev/null || true

          "$sdkmanager" "build-tools;35.0.0"

      - name: Sign the APKs
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}

          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$KS_PASS" ] ||
             [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEY_PASS" ]; then
            echo "The signing secrets are not set" >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"

          if [ ! -x "$apksigner" ] || [ ! -x "$aapt2" ]; then
            echo "Required Android Build Tools are missing" >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/release.jks"

          mkdir -p signed

          declare -A labels=(
            [termone]=TermOne
            [termtwo]=TermTwo
            [termthree]=TermThree
            [termfour]=TermFour
          )

          declare -A ids=(
            [termone]=app.term.one
            [termtwo]=app.term.two
            [termthree]=app.term.three
            [termfour]=app.term.four
          )

          for flavor in termone termtwo termthree termfour; do
            src="unsigned/$flavor.apk"

            if [ ! -f "$src" ]; then
              echo "Missing $src" >&2
              exit 1
            fi

            badging="$("$aapt2" dump badging "$src")"

            if ! grep -qF "package: name='${ids[$flavor]}'" <<< "$badging"; then
              echo "Invalid application ID in $src" >&2
              exit 1
            fi

            if ! grep -qF "versionName='$NAME'" <<< "$badging"; then
              echo "Invalid versionName in $src" >&2
              exit 1
            fi

            if ! grep -qF "versionCode='$CODE'" <<< "$badging"; then
              echo "Invalid versionCode in $src" >&2
              exit 1
            fi

            out="signed/${labels[$flavor]}-$TAG.apk"

            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$out" \
              "$src"

            "$apksigner" verify --print-certs "$out"
          done

          (
            cd signed
            sha256sum ./*.apk > SHA256SUMS
          )

          cat signed/SHA256SUMS

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish APKs to release branch
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          branch_dir="$RUNNER_TEMP/release-branch"

          # Fetch the existing release branch if it exists.
          if git ls-remote --exit-code --heads origin release \
            >/dev/null 2>&1; then

            git fetch origin \
              +refs/heads/release:refs/remotes/origin/release

            git worktree add -B release \
              "$branch_dir" \
              refs/remotes/origin/release
          else
            # Create an orphan branch with no source-code history.
            git worktree add --detach "$branch_dir" "$SHA"

            git -C "$branch_dir" switch --orphan release
            git -C "$branch_dir" clean -fdx
          fi

          dest="$branch_dir/releases/$TAG"

          # Never overwrite an existing version with different APKs.
          if [ -d "$dest" ]; then
            if diff -qr signed "$dest"; then
              echo "Version $TAG is already published with identical files."
              exit 0
            else
              echo "Version $TAG already exists with different files." >&2
              exit 1
            fi
          fi

          mkdir -p "$dest"
          cp signed/*.apk signed/SHA256SUMS "$dest/"

          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$branch_dir" add "releases/$TAG"

          git -C "$branch_dir" commit -m "Publish $TAG"

          git -C "$branch_dir" push origin HEAD:refs/heads/release

      - name: Create the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "GitHub Release $TAG already exists."

            gh release upload "$TAG" \
              signed/*.apk \
              signed/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              signed/*.apk \
              signed/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
