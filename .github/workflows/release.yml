name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.2.0"
        required: true
      run_id:
        description: "CI run to take the APKs from (empty = latest successful run for the tag)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Select the run and the commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.id }}
          SHA_EVENT: ${{ github.event.workflow_run.head_sha }}
          TAG_INPUT: ${{ inputs.tag }}
          RUN_INPUT: ${{ inputs.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$RUN_EVENT"
            sha="$SHA_EVENT"
          else
            if ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The tag must look like v1.2.3" >&2
              exit 1
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_INPUT" --jq .sha)"
            run_id="$RUN_INPUT"
            if [ -z "$run_id" ]; then
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            fi
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "No successful CI run was found for $TAG_INPUT" >&2
              exit 1
            fi
            run_sha="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
            if [ "$run_sha" != "$sha" ]; then
              echo "CI run $run_id was built from $run_sha, not from $sha ($TAG_INPUT)" >&2
              exit 1
            fi
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.sha }}
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.select.outputs.sha }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          name="$(bash scripts/version.sh get-name)"
          code="$(bash scripts/version.sh get-code)"
          tag="v$name"
          release=false
          if git tag --points-at "$SHA" | grep -qx "$tag"; then
            release=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "The tag $tag does not point at $SHA" >&2
            exit 1
          else
            echo "This commit is not tagged $tag, so there is nothing to release."
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TAG_INPUT" != "$tag" ]; then
            echo "The tag $TAG_INPUT does not match versionName $name of that commit (expected $tag)" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Download the built APKs
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name apks --dir unsigned
          ls -l unsigned

      - name: Sign the APKs
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "The signing secrets are not set" >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p signed

          declare -A labels=([termone]=TermOne [termtwo]=TermTwo [termthree]=TermThree [termfour]=TermFour)
          declare -A ids=([termone]=app.term.one [termtwo]=app.term.two [termthree]=app.term.three [termfour]=app.term.four)

          for flavor in termone termtwo termthree termfour; do
            src="unsigned/$flavor.apk"
            if [ ! -f "$src" ]; then
              echo "Missing $src" >&2
              exit 1
            fi

            badging="$("$aapt2" dump badging "$src")"
            if ! grep -qF "package: name='${ids[$flavor]}'" <<<"$badging"; then
              echo "$src does not have the application id ${ids[$flavor]}" >&2
              exit 1
            fi
            if ! grep -qF "versionName='$NAME'" <<<"$badging"; then
              echo "$src does not have versionName $NAME" >&2
              exit 1
            fi
            if ! grep -qF "versionCode='$CODE'" <<<"$badging"; then
              echo "$src does not have versionCode $CODE" >&2
              exit 1
            fi

            out="signed/${labels[$flavor]}-$TAG.apk"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$out" \
              "$src"
            "$apksigner" verify --print-certs "$out"
          done

          (cd signed && sha256sum ./*.apk > SHA256SUMS)
          cat signed/SHA256SUMS

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" signed/*.apk signed/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes