
name: Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New version tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest

    steps:
      - name: Check the branch and tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow on the main branch" >&2
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v1.2.3" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check existing tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Update the version
        id: bump
        env:
          TAG: ${{ inputs.tag }}
        run: |
          bash scripts/bump-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ steps.bump.outputs.name }}
          CODE: ${{ steps.bump.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "Version update produced no changes" >&2
            exit 1
          fi

          git commit -m "Release $TAG (versionName $NAME, versionCode $CODE) [skip ci]"

          git tag -a "$TAG" -m "Release $TAG"

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Build the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG"

          echo "CI was dispatched for $TAG"
