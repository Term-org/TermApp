
name: Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    name: Bump patch and create tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Calculate next patch version
        id: version
        run: |
          set -euo pipefail

          current="$(bash scripts/version.sh get-name)"

          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current version: $current" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current"

          next_patch=$((10#$patch + 1))
          next="$major.$minor.$next_patch"
          tag="v$next"

          echo "Current version: $current"
          echo "Next version: $next"
          echo "Tag: $tag"

          {
            echo "name=$next"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to check remote tag" >&2
              exit "$status"
            fi
          fi

      - name: Update application version
        id: bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/bump-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.bump.outputs.name }}
          CODE: ${{ steps.bump.outputs.code }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "Version update produced no changes" >&2
            exit 1
          fi

          git commit \
            -m "Release $TAG (versionName $NAME, versionCode $CODE) [skip ci]"

          git tag -a "$TAG" -m "Release $TAG"

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

      - name: Dispatch CI for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG"

          echo "CI dispatched for $TAG"
